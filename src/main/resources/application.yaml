spring:
  application:
    name: inventory
  # email 전송
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  config:
    import: optional:file:.env[.properties]

  # 데이터베이스 연결 설정
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Redis Connection Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}

  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:dummy}

server:
  port: ${SERVER_PORT:10411}

management:
  endpoints:
    web:
      exposure:
        include: health, service-registry, prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false # 메일이 안된다고 서버가 못뜨면 안되기 때문에 메일 헬스체크 비활성화

# medicine API
medicine:
  api:
    base-url: https://apis.data.go.kr/1471000/DrugPrdtPrmsnInfoService07
    detail-path: /getDrugPrdtPrmsnDtlInq06
    service-key: d9149176405bff9304536370ec6a5d7278891b544707a426bfb79fac8f87e586

security:
  jwt:
    access-token-ttl: 30m
    allowed-algorithms:
      - RS256
    issuer: account-api
    key-id: account-key-001
    audiences:
      - inventory-api